name: Build portable Terraria packages

on:
  workflow_dispatch:
  push:
    paths:
      - "terra-gui.py"
      - "build-portable.py"
      - "server/**"
      - "windows/**"
      - "terraserver/**"
      - "README.md"
      - "requirements-build.txt"
      - ".github/workflows/build-portable.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            artifact: "terraserver/linux/"
          - os: windows-latest
            label: Windows
            artifact: "terraserver/windows/"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - name: Prepare Linux Python with Tk
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv
          python3 -m venv .build-venv
          .build-venv/bin/python -m pip install -r requirements-build.txt
      - name: Install build tools
        if: runner.os != 'Linux'
        run: python -m pip install -r requirements-build.txt
      - name: Build portable package (Linux)
        if: runner.os == 'Linux'
        run: .build-venv/bin/python build-portable.py
      - name: Build portable package (Windows)
        if: runner.os != 'Linux'
        run: python build-portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: Terraria-Portable-${{ matrix.label }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
